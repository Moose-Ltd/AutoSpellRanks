name: Release

# Pushing a tag like v1.0.0-forever runs the CI checks against that ref,
# confirms the tag matches ## Version in the TOC, builds
# AutoSpellRanks-<version>.zip with the AutoSpellRanks folder at the top
# level (the layout CurseForge and the game expect), and attaches it to a
# GitHub Release. The CurseForge upload itself stays a manual step.

on:
  push:
    tags: ['v*']

jobs:
  release:
    name: Build and publish
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install luaparse
        run: npm i -g luaparse@0.3.1

      - name: Lua 5.1 syntax
        run: node tools/check.js

      - name: Version matches tag
        id: version
        run: |
          version=$(sed -n 's/^## Version:[[:space:]]*//p' AutoSpellRanks/AutoSpellRanks.toc | tr -d '\r' | head -1)
          tag="${GITHUB_REF_NAME#v}"
          echo "toc=$version tag=$tag"
          test "$version" = "$tag" || { echo "TOC version ($version) does not match tag ($tag)"; exit 1; }
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Build zip
        run: |
          version="${{ steps.version.outputs.version }}"
          stage=$(mktemp -d)
          cp -r AutoSpellRanks "$stage/AutoSpellRanks"
          find "$stage/AutoSpellRanks" -name '*.bak' -delete
          mkdir -p dist
          (cd "$stage" && zip -r -X "$GITHUB_WORKSPACE/dist/AutoSpellRanks-$version.zip" AutoSpellRanks)
          unzip -l "dist/AutoSpellRanks-$version.zip"

      - name: GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/AutoSpellRanks-*.zip
          generate_release_notes: true
